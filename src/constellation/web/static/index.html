<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>constellation control</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>constellation</h1>
    <span id="conn" class="badge offline">disconnected</span>
  </header>

  <main>
    <section class="card master">
      <h2>master</h2>
      <div class="row">
        <span class="label">tier</span>
        <span id="tier" class="value tier-low">low</span>
      </div>
      <div class="row">
        <span class="label">bpm</span>
        <span id="bpm" class="value">—</span>
      </div>
      <div class="row">
        <span class="label">beat</span>
        <span id="beat" class="beat-dot"></span>
        <span id="strength" class="value small">0.00</span>
      </div>
      <div class="row">
        <span class="label">noise floor</span>
        <span id="floor" class="value small">—</span>
      </div>
      <div class="row">
        <span class="label">onset backend</span>
        <span id="backend" class="value small">—</span>
      </div>

      <div class="flux">
        <div class="flux-row">
          <span class="flux-label">bass</span>
          <span class="meter"><span id="flux-bass" class="meter-fill"></span></span>
        </div>
        <div class="flux-row">
          <span class="flux-label">mid</span>
          <span class="meter"><span id="flux-mid" class="meter-fill"></span></span>
        </div>
        <div class="flux-row">
          <span class="flux-label">high</span>
          <span class="meter"><span id="flux-high" class="meter-fill"></span></span>
        </div>
      </div>

      <div class="slider">
        <label for="sensitivity">sensitivity <span id="sens-val">1.50</span></label>
        <input id="sensitivity" type="range" min="0.5" max="5.0" step="0.05" value="1.5" />
      </div>
    </section>

    <section class="card workers">
      <h2>workers</h2>
      <div id="worker-list" class="worker-list">
        <p class="empty">waiting for heartbeats…</p>
      </div>
    </section>

    <section id="network-card" class="card network" hidden>
      <h2>network</h2>
      <div class="row">
        <span class="label">wi-fi mode</span>
        <span id="net-mode" class="badge">?</span>
      </div>
      <div class="net-buttons">
        <button id="net-ap" type="button">switch to AP</button>
        <button id="net-wifi" type="button">switch to Wi-Fi</button>
      </div>
      <p class="net-warn">
        Switching to AP cuts the brain's internet. If you opened this
        dashboard over the home network, it will disconnect.
      </p>
      <pre id="net-output" class="net-output"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
