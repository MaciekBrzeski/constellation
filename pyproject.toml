[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation"
version = "0.1.0"
description = "Convert pixel-art animal spritesheets into kinetic constellation animations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pygame>=2.5",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
gui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "mypy>=1.8",
    "pytest-cov>=4.1",
    "pytest>=7.4",
    "ruff>=0.4",
    "sounddevice>=0.4.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.scripts]
constellation-preprocess = "constellation.cli.preprocess:main"
constellation-run = "constellation.cli.run:main"
constellation-master = "constellation.cli.master:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
