mode = "windowed"
assets_dir = "assets"

[display]
width = 1920
height = 1080
fps = 60
title = "Constellation"
bg_color = [0, 0, 0]

[animation]
target_fps = 6
idle_fps = 2
default_action = "idle"
animals = ["deer_male", "deer_female", "sample"]
action_rotate_min_sec = 8.0
action_rotate_max_sec = 20.0
tempo_rotate_factor = 1.0
strong_beat_threshold = 2.3
strong_hold_sec = 2.5

[render]
bg_star_count = 80
twinkle_probability = 0.08
twinkle_min_alpha = 0.3
star_color = [255, 255, 255]
line_color = [180, 200, 255]
line_alpha = 0.25
star_radius_min = 1
star_radius_max = 5
line_max_width = 1

[preprocess]
frame_width = 32
frame_height = 32
binarize_threshold = 128
min_contour_area = 80
corner_angle_threshold = 120.0
corner_neighbor_distance = 3
contour_max_edge = 2.0
epsilon_pct = 0.004

[audio]
sensitivity = 1.5
cooldown_ms = 200.0
silence_timeout_sec = 5.0
# Onset backend: "auto" | "aubio" | "rms" | "multiband".
# "multiband" = numpy spectral-flux detector — band-split, kick-locked tempo,
# genre-robust, no aubio system package needed. Recommended for the brain.
backend = "multiband"
fft_size = 1024
flux_history_size = 43
# *_sensitivity = std-multiplier k in the per-band threshold median + k*std.
bass_sensitivity = 3.0
mid_sensitivity = 4.0
high_sensitivity = 4.0
bass_max_hz = 250.0
high_min_hz = 4000.0
tempo_min_bpm = 50.0
tempo_max_bpm = 200.0

[network]
# mode = "standalone" runs the kiosk solo (mic + render on one Pi).
# mode = "master" runs the audio brain only — no display.
# mode = "worker" renders without a mic, listens for beats over UDP.
mode = "standalone"
broadcast_host = "255.255.255.255"
bind_host = "0.0.0.0"
port = 49500
# WiFi access point hosted by the brain (Switch OLED) — see
# scripts/switch/setup_ap.sh. ap_mode is informational; the script owns setup.
ap_mode = false
ap_ssid = "constellation"
ap_interface = "wlan0"
ap_address = "192.168.50.1"
# Worker beat-sync. render_lead_ms pre-rolls the frame flip onto the beat;
# predictive_sync = false reverts to the legacy advance-on-packet path.
render_lead_ms = 16.0
offset_window_size = 64
predictive_sync = true
